  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 54px; padding: 0 32px; border-radius: 999px;
    background: #008000; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none;
  }
  .btn:hover { opacity: .88; }
  :focus-visible { outline: 2px solid #008000; outline-offset: 3px; border-radius: 4px; }
