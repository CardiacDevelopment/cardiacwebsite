<style>

  }

    background:#75fb7a;color:#171721;font-size:16px;font-weight:500;
    min-height:52px;padding:0 32px;border-radius:32px;text-decoration:none;
    transition:opacity .18s ease;
  }
  a.btn:hover{opacity:.87}
