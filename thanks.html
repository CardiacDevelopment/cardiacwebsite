<style>
/* Layout: one held moment. Big type, the beat, a way back. */
:root{--s1:#ffffff; --s2:#f5f5f3; --s3:#ebebe8; --ink:#0b0b0c; --muted:#56565b; --line:#dcdcd8; --line-strong:#76767b; --brand:#0b0b0c; --on-brand:#ffffff; --on-brand-muted:#a4a4a9; --main:#0ca512; --on-main:#0b0b0c; --main-ink:#087410; --redact:#0b0b0c; --grain:0.05; color-scheme:light;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s1:#0b0b0c; --s2:#151516; --s3:#212123; --ink:#f5f5f3; --muted:#a4a4a9; --line:#2e2e31; --line-strong:#8a8a90; --brand:#ffffff; --on-brand:#0b0b0c; --on-brand-muted:#56565b; --main:#0ca512; --on-main:#0b0b0c; --main-ink:#3ddc45; --redact:#2a2a2d; --grain:0.08; color-scheme:dark;}}
:root[data-theme="dark"]{--s1:#0b0b0c; --s2:#151516; --s3:#212123; --ink:#f5f5f3; --muted:#a4a4a9; --line:#2e2e31; --line-strong:#8a8a90; --brand:#ffffff; --on-brand:#0b0b0c; --on-brand-muted:#56565b; --main:#0ca512; --on-main:#0b0b0c; --main-ink:#3ddc45; --redact:#2a2a2d; --grain:0.08; color-scheme:dark;}

@font-face{font-family:"Azonix";src:url(/fonts/Azonix.otf) format("opentype");font-display:swap}
:root{
  --display:"Azonix","Eurostile","Arial Black",sans-serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.7,0,.2,1);
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0}
img{max-width:100%}
html{scroll-behavior:smooth}
body{background:var(--s1);color:var(--ink);font:400 16px/26px var(--sans);-webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--s1)}
.wrap{max-width:1280px;margin-inline:auto;padding-left:max(clamp(16px,4vw,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4vw,48px),env(safe-area-inset-right,0px))}
.display{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.eyebrow{font:500 12px/16px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--s1);border-bottom:1px solid var(--line);transition:background-color .4s}
.bar .wrap{display:flex;align-items:center;gap:24px;min-height:68px}
.bar .logo{display:block;color:var(--ink);line-height:0}
.bar .logo svg{width:148px;height:auto}
.bar nav{margin-left:auto;display:flex;align-items:center;gap:22px;font:600 14px/18px var(--sans)}
.bar nav a{text-decoration:none}
.bar nav a:hover{color:var(--main-ink)}
.soon{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.tag{font:500 10px/14px var(--mono);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line-strong);border-radius:2px;padding:2px 6px;color:var(--muted)}
.theme{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:2px;background:transparent;color:var(--ink);cursor:pointer}
.theme svg{width:18px;height:18px}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme .sun{display:block}:root:not([data-theme="light"]) .theme .moon{display:none}}
@media (max-width:720px){.bar nav .hide-sm{display:none}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:2px;font:600 14px/18px var(--sans);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .2s var(--ease),background-color .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-main{background:var(--main);color:var(--on-main)}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn-ghost{background:transparent;color:inherit;border-color:currentColor}
.btn svg{width:16px;height:16px}

/* Form */
.form{display:grid;gap:18px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.form .two{grid-template-columns:1fr}}
.field{display:grid;gap:6px;min-width:0}
.field label{font:600 14px/18px var(--sans);color:var(--ink)}
.field label span{font-weight:400;color:var(--muted)}
.field input,.field textarea{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line-strong);border-radius:2px;background:var(--s1);color:var(--ink);font:400 16px/24px var(--sans)}
.field textarea{min-height:132px;resize:vertical}
.field input:focus,.field textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.hp{position:absolute;left:-9999px}
.formcard{background:var(--s1);color:var(--ink);border-radius:4px;padding:clamp(20px,3vw,36px)}
.formcard .btn{justify-self:start}

/* Contact methods */
.methods{display:grid;gap:18px}
.methods .line{display:grid;gap:2px}
.methods .val{text-decoration:none;font:500 clamp(18px,2.2vw,24px)/1.3 var(--mono);user-select:all;overflow-wrap:anywhere}
.methods .acts{display:flex;flex-wrap:wrap;gap:10px}

/* Story */
.full{margin-top:18px}
.full summary{cursor:pointer;font:600 14px/18px var(--sans);display:inline-flex;align-items:center;gap:8px;min-height:44px;list-style:none;text-decoration:underline;text-underline-offset:4px}
.full summary::-webkit-details-marker{display:none}
.full[open] summary .o{display:none}
.full:not([open]) summary .c{display:none}
.full .body{display:grid;gap:14px;max-width:62ch;color:var(--muted)}
.photo{border:3px solid var(--ink);padding:6px;line-height:0;max-width:220px}
.photo img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:filter .6s}
.photo:hover img{filter:none}

/* Footer */
.foot{border-top:1px solid var(--line)}
.foot .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:16px 32px;padding-block:28px 96px;font:400 14px/22px var(--sans);color:var(--muted)}
.foot .logo{color:var(--ink);line-height:0}
.foot .logo svg{width:120px;height:auto}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

main{min-height:calc(100svh - 69px);display:grid;align-items:center;position:relative;isolation:isolate;overflow:clip}
.done{display:grid;gap:clamp(20px,3vw,32px);padding-block:clamp(56px,10vw,128px)}
.got{font-size:clamp(34px,8.4vw,132px);line-height:1.02;animation:in 1.4s cubic-bezier(.2,.7,0,1) both}
@keyframes in{from{letter-spacing:.3em;filter:blur(12px);opacity:0}}
.beat{display:inline-block;vertical-align:.12em;margin-left:.2em;width:.32em;height:.32em;border-radius:999px;background:var(--main);animation:beat 1.1s infinite}
@keyframes beat{0%,40%,100%{transform:scale(1)}8%{transform:scale(1.45)}16%{transform:scale(1)}24%{transform:scale(1.25)}}
.done p.l{max-width:44ch;font-size:19px;line-height:30px;color:var(--muted)}
.ghost{position:absolute;z-index:-1;left:0;right:0;bottom:-.1em;pointer-events:none;font:400 clamp(90px,24vw,400px)/1 var(--display);text-transform:uppercase;color:transparent;-webkit-text-stroke:1px var(--line);white-space:nowrap}
.ghost .t{display:flex;width:max-content;animation:mq 60s linear infinite}
.ghost .t span{padding-right:.3em}
@keyframes mq{to{transform:translateX(-50%)}}
</style>
</head>

<script>
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const GLIMPSES = ["IT troubleshooting","computer setup","network configuration","Microsoft 365","Google Workspace","website development","Wix","domain management","DNS","email setup","website migrations","software implementation","software evaluations","systems integration","workflow design","technology consulting","IT support","data organization","cloud systems","backup systems","cybersecurity basics","user training","onboarding","documentation","process improvement","vendor management","RFPs","technology procurement","AV systems","audio systems","live sound","livestreaming","church technology","media systems","production planning","event technology","presentation systems","camera systems","lighting","signal flow","cable management","equipment installation","equipment repair","software troubleshooting","the thing nobody else wants to figure out"];
const KEY = new Set(["technology consulting","website development","church technology","systems integration","the thing nobody else wants to figure out"]);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

/* Theme toggle: follows the system until the viewer picks */
(function(){
  const r=document.documentElement;
  try{const s=localStorage.getItem('cm-theme');if(s)r.setAttribute('data-theme',s)}catch(e){}
  const sys=()=>matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  const eff=()=>r.getAttribute('data-theme')||sys();
  document.querySelectorAll('[data-theme-toggle]').forEach(b=>{
    const upd=()=>b.setAttribute('aria-label',eff()==='dark'?'Switch to light theme':'Switch to dark theme');
    upd();
    b.addEventListener('click',()=>{const n=eff()==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('cm-theme',n)}catch(e){}upd();document.dispatchEvent(new Event('themechange'))});
  });
})();

</script>
